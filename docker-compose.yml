version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ai_nids_postgres
    restart: always
    environment:
      POSTGRES_DB: ai_nids
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CUT_Nids_Postgres2026!
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_nids_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:CUT_Nids_Postgres2026!@db:5432/ai_nids
      TSHARK_PATH: /usr/bin/tshark
      SECRET_KEY: cut-group5-ai-nids-production-secret-key-2026
      JWT_SECRET_KEY: cut-jwt-cybersecurity-secret-key-2026
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: CUT_Nids_Admin2026!
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: ai_nids_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
